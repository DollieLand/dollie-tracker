<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>DollieLand Трекер</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css?v=12" />
</head>
<body>
    <div id="app">
        <!-- ===== ШАПКА ===== -->
        <header>
            <div class="header-bg"></div>
            <div class="header-content">
                <div class="header-top">
                    <div class="logo">
                        <span class="logo-icon">🌸</span>
                        <h1>DollieLand</h1>
                        <span class="logo-icon">✨</span>
                    </div>
                    <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">🌙</button>
                </div>
                <p class="subtitle">Ваш волшебный мир кукол</p>
                <div class="divider">•.¸♡ ♡¸.•</div>
                <p class="subtitle-small">✨ Трекер заказов ✨</p>
            </div>
        </header>

        <!-- ===== ПРОФИЛЬ ===== -->
        <div id="user-info" class="card profile-card">
            <div class="profile-avatar">👤</div>
            <div class="profile-text">
                <p class="profile-name">Добро пожаловать!</p>
                <p class="profile-id">ID: —</p>
            </div>
            <div class="profile-level" id="userLevel">🌟 Новичок</div>
        </div>

        <!-- ===== СТАТИСТИКА ===== -->
        <div id="stats-bar" class="card stats-bar" style="display:none;">
            <div class="stat-item">
                <span class="stat-number" id="statTotal">0</span>
                <span class="stat-label">Всего</span>
            </div>
            <div class="stat-divider"></div>
            <div class="stat-item">
                <span class="stat-number" id="statDelivered">0</span>
                <span class="stat-label">Доставлено</span>
            </div>
            <div class="stat-divider"></div>
            <div class="stat-item">
                <span class="stat-number" id="statInTransit">0</span>
                <span class="stat-label">В пути</span>
            </div>
            <div class="stat-divider"></div>
            <div class="stat-item">
                <span class="stat-number" id="statAvgDays">0</span>
                <span class="stat-label">Ср. дней</span>
            </div>
        </div>

        <!-- ===== КНОПКИ ===== -->
        <div class="actions">
            <button class="btn-primary" onclick="loadOrders()">
                <span class="btn-icon">📦</span>
                Мои заказы
            </button>
            <button class="btn-secondary" onclick="showFaq()">
                <span class="btn-icon">💡</span>
                FAQ
            </button>
        </div>

        <!-- ===== ПОИСК ===== -->
        <div id="search-container" style="display:none;">
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" placeholder="Поиск по ID или названию..." oninput="filterOrders(this.value)">
                <button class="search-clear" onclick="clearSearch()">✕</button>
            </div>
        </div>

        <!-- ===== СПИСОК ЗАКАЗОВ ===== -->
        <div id="orders-list">
            <div class="card empty-state">
                <div class="empty-icon">📭</div>
                <p class="empty-title">Здесь пока пусто</p>
                <p class="empty-sub">Нажмите «Мои заказы», чтобы загрузить</p>
            </div>
        </div>

        <!-- ===== ПОДВАЛ ===== -->
        <footer>
            <div class="divider">•.¸♡ ♡¸.•</div>
            <p class="footer-text">♡ С любовью, DollieLand ♡</p>
        </footer>

        <!-- ===== КНОПКА ЗАКРЫТЬ ===== -->
        <button class="btn-close" onclick="closeApp()">
            ✕ Закрыть
        </button>
    </div>
    <script src="script.js?v=12"></script>
</body>
</html>
